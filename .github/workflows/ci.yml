name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/zaska-api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/zaska-web

jobs:
  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.zaska.app/api

  # ─── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint, tests, migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: zaska
          POSTGRES_PASSWORD: zaska_ci
          POSTGRES_DB: zaska_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/fastapi/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/fastapi/requirements.txt

      - name: Install dev tools
        run: pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: ruff check backend/fastapi/app --select=E,W,F,I --ignore=E501

      - name: Run Alembic migrations (smoke test)
        env:
          DATABASE_URL: postgresql+psycopg://zaska:zaska_ci@localhost:5432/zaska_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          JWT_SECRET: ci-test-jwt-secret-exactly-64-characters-for-hs256-validation-ok
          ENV: development
          PAYMENT_MODE: mock
        run: |
          cd backend/fastapi
          python -m alembic upgrade head

      - name: Run test suite
        env:
          DATABASE_URL: postgresql+psycopg://zaska:zaska_ci@localhost:5432/zaska_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          JWT_SECRET: ci-test-jwt-secret-exactly-64-characters-for-hs256-validation-ok
          ENV: development
          PAYMENT_MODE: mock
        run: |
          cd backend/fastapi
          python -m pytest tests/ -v --tb=short -x

  # ─── Docker build (main branch only) ──────────────────────────────────────
  docker-build:
    name: Docker — build & push images
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/fastapi/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Security scan (main branch only) ─────────────────────────────────────
  security:
    name: Security — dependency audit
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/fastapi/requirements.txt --ignore-vuln PYSEC-2022-42969
        continue-on-error: true

  # ─── Deploy (main branch only, after CI passes) ────────────────────────────
  # Requires these secrets in GitHub repo Settings → Secrets → Actions:
  #   DO_HOST         — IP address of the DigitalOcean server
  #   DO_USER         — SSH username (root or ubuntu)
  #   DO_SSH_KEY      — full private SSH key content (-----BEGIN OPENSSH PRIVATE KEY-----)
  #   DO_DEPLOY_PATH  — (optional) project path on server, default: /opt/zaska
  deploy:
    name: Deploy — DigitalOcean
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.DO_DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/zaska}"

            echo "▶ Pulling latest code..."
            cd "$DEPLOY_PATH"
            git pull origin main

            echo "▶ Rebuilding and restarting services..."
            docker compose --profile production up -d --build --remove-orphans

            echo "▶ Waiting for backend health check..."
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' zaska-backend 2>/dev/null || echo "missing")
              if [ "$STATUS" = "healthy" ]; then
                echo "✓ Backend is healthy"
                break
              fi
              if [ "$i" = "24" ]; then
                echo "✗ Backend did not become healthy in time"
                docker compose logs --tail=50 backend
                exit 1
              fi
              echo "  waiting... ($i/24)"
              sleep 5
            done

            echo "▶ Cleaning up old images..."
            docker image prune -f

            echo "✓ Deployment complete"
