services:
  backend:
    env_file:
      - backend/fastapi/.env.certification
    environment:
      DATABASE_URL: postgresql+psycopg://zaska_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/zaska
      ALEMBIC_DATABASE_URL: postgresql+psycopg://zaska_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/zaska
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
