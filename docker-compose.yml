services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: zaska-postgres
    environment:
      POSTGRES_DB: zaska
      POSTGRES_USER: zaska_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # WAL archiving: ZASKA PITR infrastructure.
    # archive_command copies each completed WAL segment to /var/wal-archive atomically.
    # archive_timeout=60 forces a segment switch every 60s so the worst-case data loss
    # window (gap between last archived WAL and incident) is ≤ 60 seconds.
    # In production, set ARCHIVE_TARGET=s3://bucket/prefix and install aws-cli/rclone
    # in a custom PostgreSQL image — the script honours $ARCHIVE_TARGET.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      # sh prefix: on Windows, git does not preserve execute bits on shell scripts.
      # Without sh, PostgreSQL would fail with "permission denied" when the archive
      # command runs — silently leaving WAL segments unarchived (RPO violated).
      - archive_command=sh /var/wal-archive-scripts/wal-archive.sh %p %f
      - -c
      - archive_timeout=60
      - -c
      - max_wal_senders=3
      - -c
      - wal_keep_size=1024
      - -c
      - hot_standby=on
    # DEV ONLY: set POSTGRES_PUBLISH_PORT=5417 in .env to expose locally. Never expose in production.
    ports:
      - "${POSTGRES_PUBLISH_PORT:-}:5432"
    volumes:
      - zaska-postgres-data:/var/lib/postgresql/data
      - zaska-wal-archive:/var/wal-archive
      # Mount the archive script read-only so PostgreSQL can call it
      - ./scripts:/var/wal-archive-scripts:ro
    networks:
      - zaska-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaska_admin -d zaska"]
      interval: 10s
      timeout: 5s
      retries: 10

  # PgBouncer — connection pooler between FastAPI pods and PostgreSQL.
  #
  # WHY: With HPA scaling to 10 pods and DB_POOL_SIZE=10 per pod, worst-case
  # connections = 10 × 30 = 300, which exceeds PostgreSQL's default max_connections=100
  # and causes cascading connection refusals under load.
  #
  # pool_mode=transaction: connection is held only during an active transaction
  # (not the full FastAPI request lifetime). This allows 1000 FastAPI connections
  # to multiplex through 20 PostgreSQL connections — 50:1 multiplexing.
  #
  # FastAPI connects to pgbouncer:6432 instead of postgres:5432.
  # DB_POOL_SIZE is reduced to 3 because PgBouncer absorbs burst concurrency.
  pgbouncer:
    image: edoburu/pgbouncer:1.17.0
    container_name: zaska-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      LISTEN_PORT: "6432"
      DB_USER: zaska_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: zaska
      # postgres uses scram-sha-256; pgbouncer needs the plaintext password in
      # userlist.txt to complete SCRAM auth against the backend server.
      #
      # NOTE: AUTH_TYPE=scram-sha-256 was tried (to make pgbouncer run real SCRAM
      # with our app too, instead of clear-text password compare) but pgbouncer
      # 1.17 (this image's pinned version) fails client SASL auth against a
      # plain-text userlist entry ("FATAL: SASL authentication failed" from
      # psycopg). This is a known upstream limitation in 1.17 — revisit once we
      # migrate to a maintained pgbouncer image with a newer release (>=1.21).
      AUTH_TYPE: plain
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      # DEALLOCATE ALL resets prepared statements between connections in transaction mode.
      # Required: psycopg3 uses prepared statements by default; without this reset,
      # a connection borrowed from a different client's context may see stale prepared stmt state.
      SERVER_RESET_QUERY: DEALLOCATE ALL
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      # Admin interface (internal only, never expose externally)
      ADMIN_USERS: zaska_admin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zaska-network
    healthcheck:
      # pg_isready is NOT available in the edoburu/pgbouncer Alpine image.
      # /dev/tcp is a bash-ism not supported by this image's ash shell; use nc instead.
      # PgBouncer listens on 6432; if it's up, the TCP connect succeeds.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis HA: master + replica + 3 sentinels ───────────────────────────────
  # Sentinel quorum = 2: any 2 of 3 sentinels must agree before failover.
  # With 3 sentinels, the cluster survives loss of 1 sentinel node.
  redis-master:
    image: redis:7-alpine
    container_name: zaska-redis-master
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 512mb --maxmemory-policy volatile-lru --save "" --appendonly no;
        else
          redis-server --maxmemory 512mb --maxmemory-policy volatile-lru --save "" --appendonly no;
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # DEV ONLY: set REDIS_PUBLISH_PORT=16379 in .env
    ports:
      - "${REDIS_PUBLISH_PORT:-}:6379"
    networks:
      - zaska-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-replica:
    image: redis:7-alpine
    container_name: zaska-redis-replica
    command: >
      sh -c '
        redis-server --replicaof redis-master 6379 --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD"
          --maxmemory 512mb --maxmemory-policy volatile-lru --save "" --appendonly no --replica-read-only yes;
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - zaska-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-sentinel-1: &sentinel
    image: redis:7-alpine
    container_name: zaska-sentinel-1
    command: >
      sh -c '
        echo "sentinel monitor zaska-master redis-master 6379 2" > /tmp/sentinel.conf &&
        echo "sentinel down-after-milliseconds zaska-master 5000" >> /tmp/sentinel.conf &&
        echo "sentinel parallel-syncs zaska-master 1" >> /tmp/sentinel.conf &&
        echo "sentinel failover-timeout zaska-master 120000" >> /tmp/sentinel.conf &&
        echo "sentinel auth-pass zaska-master $$REDIS_PASSWORD" >> /tmp/sentinel.conf &&
        redis-sentinel /tmp/sentinel.conf
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    networks:
      - zaska-network

  redis-sentinel-2:
    <<: *sentinel
    container_name: zaska-sentinel-2

  redis-sentinel-3:
    <<: *sentinel
    container_name: zaska-sentinel-3

  # Convenience alias for backward compat — services that reference "redis" still work
  redis:
    image: redis:7-alpine
    container_name: zaska-redis
    command: >
      sh -c 'redis-server --port 6379 --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy volatile-lru --save "" --appendonly no'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - zaska-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/fastapi/Dockerfile
    container_name: zaska-backend
    env_file:
      - backend/fastapi/.env
    environment:
      # Routes through PgBouncer (port 6432) — NOT directly to postgres:5432.
      # PgBouncer multiplexes up to 1000 client connections onto 20 PostgreSQL connections.
      # DB_POOL_SIZE=3: small pool because PgBouncer absorbs the concurrency.
      # IMPORTANT: alembic runs before the server starts (docker-entrypoint.sh) and must
      # connect directly to postgres:5432 to avoid transaction-mode limitations on DDL.
      # The alembic.ini URL is overridden at runtime via ALEMBIC_DATABASE_URL.
      DATABASE_URL: postgresql+psycopg://zaska_admin:${POSTGRES_PASSWORD:-secure_env_var}@pgbouncer:6432/zaska
      ALEMBIC_DATABASE_URL: postgresql+psycopg://zaska_admin:${POSTGRES_PASSWORD:-secure_env_var}@postgres:5432/zaska
      DB_POOL_SIZE: "3"
      DB_MAX_OVERFLOW: "2"
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      PYTHONPATH: /app/backend/fastapi
    volumes:
      - ./backend/fastapi/app:/app/backend/fastapi/app
      - ./backend/fastapi/alembic:/app/backend/fastapi/alembic
      - zaska-backups:/app/backups
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PUBLISH_PORT:-6969}:6969"
    networks:
      - zaska-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6969/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:6969/api}
    container_name: zaska-frontend
    depends_on:
      backend:
        condition: service_healthy
    # In production, expose via nginx proxy — direct port only for dev.
    ports:
      - "${FRONTEND_PUBLISH_PORT:-3010}:3010"
    networks:
      - zaska-network
    restart: unless-stopped

  # ── Nginx reverse proxy (production profile) ────────────────────────────────
  # Enable with: docker compose --profile production up
  nginx:
    image: nginx:1.25-alpine
    container_name: zaska-nginx
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount SSL certs — generate with: certbot certonly --standalone -d yourdomain.com
      # or use self-signed for staging: ./scripts/gen-self-signed-cert.sh
      - ${SSL_CERT_PATH:-./docker/nginx/certs}:/etc/ssl/certs:ro
      - ${SSL_KEY_PATH:-./docker/nginx/certs}:/etc/ssl/private:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - zaska-network
    restart: unless-stopped

  # ── Observability stack ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: zaska-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - zaska-prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - zaska-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.0.0
    container_name: zaska-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_INSTALL_PLUGINS: ''
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/grafana/'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - zaska-grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3200}:3000"
    networks:
      - zaska-network
    restart: unless-stopped
    depends_on:
      - prometheus

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: zaska-redis-exporter
    environment:
      REDIS_ADDR: redis://redis-master:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - zaska-network
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: zaska-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://zaska_admin:${POSTGRES_PASSWORD}@postgres:5432/zaska?sslmode=disable
    networks:
      - zaska-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

networks:
  zaska-network:
    driver: bridge

volumes:
  zaska-postgres-data:
  zaska-backups:
  zaska-prometheus-data:
  zaska-grafana-data:
  # WAL archive volume — stores continuous WAL segments for PITR.
  # In production, mount a fast SSD or use an NFS path that syncs to S3/B2.
  # Retention: keep at least 7 days of WALs (24h × WAL-per-60s × 7 = ~10k files, ~10GB).
  # Pair with a cron job that pushes to object storage and prunes old segments.
  zaska-wal-archive:
