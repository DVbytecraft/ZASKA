
# render.yaml — ZASKA Blueprint (Free Tier)
# Deploy: https://dashboard.render.com/select-repo
#
# Before deploying:
#   1. Create a FREE Redis at https://upstash.com (no credit card required)
#   2. Copy your Upstash Redis URL (starts with rediss://)
#   3. After Blueprint deploys, paste it in the dashboard for REDIS_URL,
#      CELERY_BROKER_URL, and CELERY_RESULT_BACKEND

databases:
  - name: zaska-postgres
    databaseName: zaska
    user: zaska_admin
    plan: free              # free tier — expires after 90 days, export before then
    postgresMajorVersion: "16"

services:
  # ── Backend API (FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: zaska-backend
    runtime: docker
    dockerfilePath: ./backend/fastapi/Dockerfile
    dockerContext: .
    plan: free              # spins down after 15 min — keep-alive workflow (.github/workflows/keep-alive.yml) prevents this
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zaska-postgres
          property: connectionString   # auto-filled — config.py converts to +psycopg
      - key: PYTHONPATH
        value: /app/backend/fastapi
      - key: ENV
        value: staging
      - key: PAYMENT_MODE
        value: sandbox
      - key: OTP_PROVIDER
        value: smtp
      - key: JWT_SECRET
        generateValue: true
      # ── Set these manually in Render dashboard after deploy ────────────────
      - key: REDIS_URL
        sync: false          # paste your Upstash URL: rediss://default:xxx@host:port
      - key: CELERY_BROKER_URL
        sync: false          # same Upstash URL
      - key: CELERY_RESULT_BACKEND
        sync: false          # same Upstash URL
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: ADMIN_NOTIFICATION_EMAILS
        sync: false          # comma-separated: admin@zaska.app,ops@zaska.app
      - key: APP_FRONTEND_URL
        sync: false          # e.g. https://zaska-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # e.g. https://zaska-frontend.onrender.com
      - key: PAYMENT_WEBHOOK_BASE_URL
        sync: false          # e.g. https://zaska-backend.onrender.com
      - key: PAYMENT_REDIRECT_URL
        sync: false          # e.g. https://zaska-frontend.onrender.com/payment/success
      # ── Payment provider sandbox keys (at least one required) ────────────────
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false          # starts with FLWSECK_TEST-  (free sandbox account)
      - key: STRIPE_SECRET_KEY
        sync: false          # starts with sk_test_  (free sandbox account)
      - key: FEDAPAY_API_KEY
        sync: false          # starts with sk_sandbox_  (free sandbox account)
      - key: PAYSTACK_SECRET_KEY
        sync: false          # starts with sk_test_  (free sandbox account)

  # ── Frontend (React/Vite — static build) ───────────────────────────────────
  - type: web
    name: zaska-frontend
    runtime: static
    buildCommand: npm ci && npx vite build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://zaska-backend.onrender.com/api
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
