name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/zaska-api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/zaska-web

jobs:
  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Lint
        run: npx eslint src --ext .ts,.tsx --max-warnings 20
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://zaska-backend.onrender.com/api

  # ─── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint, tests, migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: zaska
          POSTGRES_PASSWORD: zaska_ci
          POSTGRES_DB: zaska_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/fastapi/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/fastapi/requirements.txt

      - name: Install dev tools
        run: pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: ruff check backend/fastapi/app --select=E,W,F,I --ignore=E501
        continue-on-error: true

      - name: Run Alembic migrations (smoke test)
        env:
          DATABASE_URL: postgresql+psycopg://zaska:zaska_ci@localhost:5432/zaska_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          JWT_SECRET: ci-test-jwt-secret-exactly-64-characters-for-hs256-validation-ok
          ENV: development
          PAYMENT_MODE: mock
        run: |
          cd backend/fastapi
          python -m alembic upgrade head

      - name: Run test suite
        env:
          DATABASE_URL: postgresql+psycopg://zaska:zaska_ci@localhost:5432/zaska_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          JWT_SECRET: ci-test-jwt-secret-exactly-64-characters-for-hs256-validation-ok
          ENV: development
          PAYMENT_MODE: mock
        run: |
          cd backend/fastapi
          python -m pytest tests/ -v --tb=short -x
        continue-on-error: true

  # ─── Deploy to Render (main branch only, after CI passes) ─────────────────
  # Setup (one-time, per service):
  #   1. Render dashboard → your service → Settings → Deploy Hook → copy URL
  #   2. GitHub repo → Settings → Secrets → Actions → New secret
  #      Name: RENDER_DEPLOY_HOOK_BACKEND   Value: <the URL from Render>
  #      Name: RENDER_DEPLOY_HOOK_FRONTEND  Value: <the URL from Render>
  deploy:
    name: Deploy — Render
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploys
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          FRONTEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -n "$BACKEND_HOOK" ]; then
            curl -f -X POST "$BACKEND_HOOK"
            echo "Backend deploy triggered"
          else
            echo "Skipping backend — add RENDER_DEPLOY_HOOK_BACKEND to GitHub secrets"
          fi
          if [ -n "$FRONTEND_HOOK" ]; then
            curl -f -X POST "$FRONTEND_HOOK"
            echo "Frontend deploy triggered"
          else
            echo "Skipping frontend — add RENDER_DEPLOY_HOOK_FRONTEND to GitHub secrets"
          fi

  # ─── Security scan (main branch only) ─────────────────────────────────────
  security:
    name: Security — dependency audit
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/fastapi/requirements.txt --ignore-vuln PYSEC-2022-42969
        continue-on-error: true
