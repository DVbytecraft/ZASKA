# ZASKA — Nginx reverse proxy configuration
#
# This file is included inside the http{} block by nginx's main config.
# limit_req_zone MUST be at http{} level (this file's top level), NOT inside server{}.
# The previous version had limit_req_zone inside server{} which caused nginx to refuse
# to start with "limit_req_zone" directive is not allowed here.

# ── Rate limit zones (http{} level — shared across all server blocks) ────────
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/zaska.crt;
    ssl_certificate_key /etc/ssl/private/zaska.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)"  always;

    # Content-Security-Policy
    # connect-src includes wss: for WebSocket + WebRTC signaling
    set $csp "
        default-src 'self';
        script-src  'self';
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src    'self' https://fonts.gstatic.com;
        img-src     'self' data: https:;
        connect-src 'self' wss: https://api.stripe.com https://js.stripe.com;
        frame-src   https://js.stripe.com https://hooks.stripe.com;
        object-src  'none';
        base-uri    'self';
        form-action 'self';
    ";
    add_header Content-Security-Policy $csp always;

    # ── Static assets — long-lived cache ──────────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options    "nosniff"                                        always;
        add_header X-Frame-Options           "DENY"                                           always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"   always;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Auth endpoints — strict rate limit ────────────────────────────────────
    location ~ ^/api/auth/(login|register|verify-otp|forgot-password) {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass            http://backend:6969;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass            http://backend:6969;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_hide_header     X-Powered-By;
        client_max_body_size  10m;
    }

    # ── WebSocket proxy ────────────────────────────────────────────────────────
    # Requires Upgrade + Connection headers and long timeouts for idle connections.
    # proxy_read_timeout 3600s: WebSocket connections are long-lived (chat, calls).
    # Without this, nginx terminates idle WS connections after 60s (default).
    location /ws/ {
        proxy_pass            http://backend:6969;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade     $http_upgrade;
        proxy_set_header      Connection  "Upgrade";
        proxy_set_header      Host        $host;
        proxy_set_header      X-Real-IP   $remote_addr;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # ── Health check (internal — Kubernetes/LB probes) ────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
